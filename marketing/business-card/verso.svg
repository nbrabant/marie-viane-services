<?xml version="1.0" encoding="UTF-8"?>
<!-- Carte de visite Verso - Format fini 85x55mm, fichier fond perdu 88x58mm (1.5mm de fond perdu par côté) - MV Services V2 -->
<svg xmlns="http://www.w3.org/2000/svg" width="88mm" height="58mm" viewBox="0 0 88 58">
  <!-- Fond sombre élégant (couvre tout le fond perdu) -->
  <rect x="0" y="0" width="88" height="58" fill="#f7f8ef"/>

  <!-- Accent graphique latéral, étendu jusqu'au bord de fond perdu -->
  <rect x="0" y="0" width="3.5" height="58" fill="#2b795c"/>

  <!-- Contenu, recentré dans la zone de coupe 85x55mm -->
  <g transform="translate(1.5, 1.5)">
    <!-- Colonne Gauche : Mes Services -->
    <text x="5" y="11" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="3.2" font-weight="800" fill="#2b795c" letter-spacing="0.5">MES SERVICES</text>
    <line x1="5" y1="13.5" x2="44" y2="13.5" stroke="#588157" stroke-width="0.5" opacity="0.6"/>

    <!-- Service 1 -->
    <g transform="translate(5, 17)">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#2b795c"/>
      <text x="4.5" y="2" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="2.9" font-weight="600" fill="#FFFFFF">Aide &amp; accompagnement</text>
    </g>

    <!-- Service 2 -->
    <g transform="translate(5, 23)">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#2b795c"/>
      <text x="4.5" y="2" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="2.9" font-weight="600" fill="#FFFFFF">Ménage &amp; repassage</text>
    </g>

    <!-- Service 3 -->
    <g transform="translate(5, 29)">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#2b795c"/>
      <text x="4.5" y="2" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="2.9" font-weight="600" fill="#FFFFFF">Nettoyage professionnel</text>
    </g>

    <!-- Service 4 -->
    <g transform="translate(5, 35)">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#2b795c"/>
      <text x="4.5" y="2" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="2.9" font-weight="600" fill="#FFFFFF">Prestations sur-mesure</text>
    </g>

  <!-- Encadré Crédit d'Impôt -->
  <rect x="5" y="41" width="40" height="9.5" rx="1.5" fill="#2A9D8F" fill-opacity="0.15" stroke="#2A9D8F" stroke-width="0.4"/>
  <text x="24.5" y="44.8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="2.5" font-weight="800" fill="#2A9D8F" text-anchor="middle">50% DE CRÉDIT D'IMPÔT</text>
  <text x="24.5" y="48.3" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="1.9" font-weight="600" fill="#E2E8F0" text-anchor="middle">Avance immédiate disponible</text>

  <!-- Ligne de séparation centrale -->
  <line x1="48" y1="10" x2="48" y2="48" stroke="#334155" stroke-width="0.4"/>

