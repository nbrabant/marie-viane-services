<?xml version="1.0" encoding="UTF-8"?>
<!-- Carte de visite Recto - Format fini 85x55mm, fichier fond perdu 88x58mm (1.5mm de fond perdu par côté) -->
<svg xmlns="http://www.w3.org/2000/svg" width="88mm" height="58mm" viewBox="0 0 88 58">
  <!-- Fond (couvre tout le fond perdu) -->
  <rect x="0" y="0" width="88" height="58" fill="#FFFFFF"/>

  <!-- Contenu, recentré dans la zone de coupe 85x55mm -->
  <g transform="translate(1.5, 1.5)">
    <!-- Logo (icône + nom) -->
    <g transform="translate(7, 3) scale(0.17) translate(-60, -30)">
      <g transform="translate(30, 22)">
        <circle cx="38" cy="38" r="34" fill="#F0F4F8"/>
        <path d="M 18 42 L 38 22 L 58 42 V 60 C 58 63 55 66 52 66 H 24 C 21 66 18 63 18 60 Z"
              fill="none" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 38 34 C 44 34 46 42 46 48 C 40 48 38 42 38 34 Z" fill="#588157"/>
        <path d="M 38 34 C 32 34 30 42 30 48 C 36 48 38 42 38 34 Z" fill="#2A9D8F"/>
      </g>
      <text x="110" y="60" font-family="'Plus Jakarta Sans', 'Arial', sans-serif" font-size="28" font-weight="800" fill="#1E293B" letter-spacing="1">MV SERVICES</text>
      <text x="110" y="80" font-family="'Plus Jakarta Sans', 'Arial', sans-serif" font-size="12" font-weight="600" fill="#588157" letter-spacing="2">AIDE À DOMICILE &amp; NETTOYAGE</text>
    </g>

    <!-- Ligne de séparation fine -->
    <line x1="3" y1="18" x2="78" y2="18" stroke="#E2E8F0" stroke-width="0.4"/>

    <!-- Identité -->
    <text x="5" y="31" font-family="'Plus Jakarta Sans', 'Arial', sans-serif" font-size="6" font-weight="800" fill="#1E293B">Marie Viane</text>
    <text x="5" y="35" font-family="'Plus Jakarta Sans', 'Arial', sans-serif" font-size="3" font-weight="600" fill="#2b795c">Gérante &amp; Service à la personne</text>

    <!-- Bloc Contact (Téléphone + Site Web) -->
    <!-- Téléphone -->
    <g transform="translate(5, 40.5)">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#F0F4F8"/>
      <path d="M1 0.8 C1 0.6 1.2 0.5 1.4 0.5 H1.8 C1.9 0.5 2 0.6 2 0.7 L2.2 1.3 C2.3 1.4 2.2 1.5 2.1 1.6 L1.8 1.9 C2.1 2.5 2.5 2.9 3.1 3.2 L3.4 2.9 C3.5 2.8 3.6 2.7 3.7 2.8 L4.3 3 C4.4 3 4.5 3.1 4.5 3.2 V3.6 C4.5 3.8 4.3 4 4.1 4 C2.3 4 1 2.7 1 0.9 Z" fill="#2b795c" transform="scale(0.7)"/>
      <text x="5" y="2.3" font-family="'Plus Jakarta Sans', 'Arial', sans-serif" font-size="3.2" font-weight="700" fill="#1E293B">07 50 65 37 53</text>
    </g>

    <!-- Site Web -->
    <g transform="translate(5, 46.5)">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#F0F4F8"/>
      <circle cx="1.5" cy="1.5" r="1.1" fill="none" stroke="#2b795c" stroke-width="0.3"/>
      <line x1="0.4" y1="1.5" x2="2.6" y2="1.5" stroke="#2b795c" stroke-width="0.2"/>
      <text x="5" y="2.3" font-family="'Plus Jakarta Sans', 'Arial', sans-serif" font-size="3.2" font-weight="700" fill="#2b795c">r-rems@hotmail.fr</text>
    </g>
  </g>

  <!-- Bande de rappel couleur en bas, étendue jusqu'au bord de fond perdu -->
  <rect x="0" y="54.5" width="88" height="3.5" fill="#2b795c"/>
</svg>
